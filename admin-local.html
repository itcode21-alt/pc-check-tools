<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITSVC 로컬 관리자</title>
<style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;background:#f6f7fb;color:#172033}section{background:white;border:1px solid #dfe3ec;border-radius:12px;padding:20px;margin:14px 0}button,input{padding:10px;border:1px solid #cbd5e1;border-radius:7px}button{cursor:pointer;background:#1d4ed8;color:white;border:0;margin:4px 4px 4px 0}pre{white-space:pre-wrap;background:#111827;color:#d1fae5;padding:14px;border-radius:8px;min-height:80px}small{color:#64748b}</style>
<h1>ITSVC 로컬 관리자</h1><small>맥미니에서 실행하고, 맥북에서는 안전한 내부 접속으로 사용합니다.</small>
<section><h2>인증</h2><input id="token" type="password" placeholder="관리자 토큰" size="35"><button onclick="refresh()">상태 확인</button></section>
<section><h2>운영 상태</h2><pre id="status">아직 확인하지 않았습니다.</pre><button onclick="refresh()">상태 확인</button><button onclick="sync()">GitHub 최신 내용 받기</button><button onclick="check()">품질 검사</button><button onclick="production()">공개 사이트 확인</button></section>
<section><h2>데이터 자동화</h2><p>항목별로 공식 출처를 확인하고, 기존 원문과 중복되지 않는 새 자료만 검토용 폴더에 저장합니다.</p><button onclick="catalog()">데이터 현황</button><button onclick="collect('pc-errors')">PC 오류 수집</button><button onclick="collect('game-errors')">게임 오류 수집</button><button onclick="collect('windows-updates')">Windows 업데이트 수집</button><button onclick="prepare()">수집 폴더 준비</button><button onclick="collectPlan()">수집 계획 보기</button></section>
<section><h2>배포</h2><input id="message" placeholder="커밋 메시지" size="35"><button onclick="deploy()">GitHub 반영</button></section>
<script>
const out=document.querySelector('#status'); const auth=()=>({Authorization:`Bearer ${document.querySelector('#token').value}`,'Content-Type':'application/json'});
async function call(path,method='GET',data){const r=await fetch(path,{method,headers:auth(),body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'요청 실패');return j}
async function show(fn){try{out.textContent=JSON.stringify(await fn(),null,2)}catch(e){out.textContent=`오류: ${e.message}`}}
function refresh(){show(()=>call('/api/status'))} function sync(){show(()=>call('/api/sync','POST'))} function check(){show(()=>call('/api/check','POST'))} function production(){show(()=>call('/api/production'))} function deploy(){show(()=>call('/api/deploy','POST',{message:document.querySelector('#message').value}))}
function catalog(){show(()=>call('/api/catalog'))} function collect(type){show(()=>call('/api/collect','POST',{type}))} function prepare(){show(()=>call('/api/prepare-inbox','POST'))} function collectPlan(){out.textContent=JSON.stringify({순서:['항목 선택','공식 자료 수집','fingerprint 생성','기존 데이터와 중복 비교','새 항목만 data/inbox에 저장','관리자 검토 후 GitHub 반영'],대상:['PC 오류코드·증상','현재 등록된 9개 게임 오류','Windows 업데이트 이슈']},null,2)}
</script>
